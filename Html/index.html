<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EquityJournal - Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar navbar-expand-md navbar-dark sticky-top">
    <div class="container">
      <a class="navbar-brand" href="index.html">EquityJournal</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuUtama" aria-controls="menuUtama" aria-expanded="false" aria-label="Buka menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menuUtama">
        <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link active" aria-current="page" href="index.html">Dashboard</a></li>
        <li class="nav-item"><a class="nav-link" href="riwayat.html">Riwayat Trading</a></li>
        <li class="nav-item"><a class="nav-link" href="tambahjurnal.html">Tambah Jurnal</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-start gap-2 mb-3">
      <div>
        <h1 class="h3 mb-1">Dashboard</h1>
        <p class="text-secondary mb-0">Ringkasan catatan portofolio &amp; riwayat transaksi saham.</p>
      </div>
      <button type="button" id="btn-toggle-ringkasan" class="btn btn-sm btn-filter">Sembunyikan ringkasan</button>
    </div>

    <div class="row g-3 mb-3" id="dash-stat"></div>

    <div class="row g-3">
      <div class="col-12 col-lg-8">
        <div class="card h-100">
          <div class="card-header">Transaksi terbaru</div>
          <ul class="list-group list-group-flush" id="dash-terbaru"></ul>
          <div class="card-footer text-end"><a href="riwayat.html">Lihat semua riwayat</a></div>
        </div>
      </div>

      <div class="col-12 col-lg-4">
        <div class="card mb-3">
          <div class="card-body">
            <h2 class="h6">Komposisi nilai posisi</h2>
            <div class="progress mb-2" id="bar-komposisi" role="progressbar" aria-label="Proporsi nilai Hold" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100" style="height:14px">
              <div class="progress-bar bg-success" id="bar-hold" style="width:0%"></div>
              <div class="progress-bar bg-danger" id="bar-jual" style="width:0%"></div>
            </div>
            <div class="small d-flex justify-content-between"><span id="teks-hold"></span><span id="teks-jual"></span></div>
          </div>
        </div>
        <div class="card">
          <div class="card-header">Posisi Hold saat ini</div>
          <ul class="list-group list-group-flush" id="dash-hold"></ul>
          <div class="card-footer text-end"><a href="tambahjurnal.html">+ Tambah jurnal</a></div>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer-utama">
    <p class="mb-0">&copy; 2026 EquityJournal</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
