<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EquityJournal - Tambah Jurnal Baru</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar navbar-expand-md navbar-dark sticky-top">
    <div class="container">
      <a class="navbar-brand" href="index.html">EquityJournal</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuUtama" aria-controls="menuUtama" aria-expanded="false" aria-label="Buka menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menuUtama">
        <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Dashboard</a></li>
        <li class="nav-item"><a class="nav-link" href="riwayat.html">Riwayat Trading</a></li>
        <li class="nav-item"><a class="nav-link active" aria-current="page" href="tambahjurnal.html">Tambah Jurnal</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <div class="row justify-content-center">
      <div class="col-12 col-lg-8">
        <h1 class="h3 mb-1">Form Jurnal Trading Baru</h1>
        <p class="text-secondary">Lengkapi data transaksi di bawah ini untuk mencatat aktivitas jual beli saham Anda.</p>

        <div class="card"><div class="card-body">
          <form action="#" method="post">
            <div class="row g-3">
              <div class="col-12 col-md-6">
                <label for="tanggal" class="form-label">Tanggal Transaksi</label>
                <input type="date" class="form-control" id="tanggal" name="tanggal" required>
              </div>
              <div class="col-12 col-md-6">
                <label for="ticker" class="form-label">Ticker / Kode Saham</label>
                <input type="text" class="form-control" id="ticker" name="ticker" maxlength="4" placeholder="Contoh: SUPA" required>
              </div>
              <div class="col-12 col-md-6">
                <label for="jumlah-lot" class="form-label">Jumlah Lot</label>
                <input type="number" class="form-control" id="jumlah-lot" name="jumlah-lot" min="1" step="1" placeholder="Contoh: 10" required>
              </div>
              <div class="col-12 col-md-6">
                <label for="harga-beli" class="form-label">Harga Beli per Lembar (Rp)</label>
                <input type="number" class="form-control" id="harga-beli" name="harga-beli" min="1" step="1" placeholder="Contoh: 292" required>
              </div>
              <div class="col-12 col-md-6">
                <label for="sekuritas" class="form-label">Sekuritas / Broker</label>
                <select class="form-select" id="sekuritas" name="sekuritas">
                  <option value="stockbit">Stockbit</option>
                  <option value="indopremier">IndoPremier</option>
                  <option value="ajaib">Ajaib</option>
                  <option value="mirae">Mirae Asset Sekuritas</option>
                </select>
              </div>
              <div class="col-12 col-md-6">
                <label for="status" class="form-label">Status Saat Ini</label>
                <select class="form-select" id="status" name="status">
                  <option value="hold">Hold</option>
                  <option value="jual">Jual</option>
                </select>
              </div>
              <div class="col-12">
                <fieldset>
                  <legend class="form-label fs-6">Jenis Transaksi</legend>
                  <div class="form-check">
                    <input class="form-check-input" type="radio" id="beli-reguler" name="jenis-transaksi" value="reguler" checked>
                    <label class="form-check-label" for="beli-reguler">Beli Reguler (Pasar Sekunder)</label>
                  </div>
                  <div class="form-check">
                    <input class="form-check-input" type="radio" id="beli-ipo" name="jenis-transaksi" value="ipo">
                    <label class="form-check-label" for="beli-ipo">Hasil Penjatahan IPO</label>
                  </div>
                </fieldset>
              </div>
              <div class="col-12">
                <label for="trading-plan" class="form-label">Alasan Beli / Trading Plan</label>
                <textarea class="form-control" id="trading-plan" name="trading-plan" rows="5" placeholder="Contoh: Beli karena laporan keuangan kuartal 3 bagus dan berhasil tembus resisten di harga 300."></textarea>
              </div>
              <div class="col-12 d-flex flex-column flex-sm-row gap-2">
                <button type="submit" class="btn btn-navy">Simpan Jurnal</button>
                <button type="reset" class="btn btn-outline-secondary">Bersihkan Form</button>
              </div>
            </div>
          </form>
        </div></div>
      </div>
    </div>
  </main>

  <footer class="footer-utama">
    <p class="mb-0">&copy; 2026 EquityJournal</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
